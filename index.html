<!DOCTYPE html>
<html>
<head>
  <title>Zain's Pizza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍕 Zain's Pizza</h1>
    <p>Fresh pizzas, made with love.</p>
  </header>

  <section class="menu-section">
    <h2>Our Menu</h2>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <section class="cart-section">
    <h2>Your Cart</h2>
    <div id="cartDisplay"></div>
    <p class="cart-total">Total: Rs. <span id="cartTotal">0</span></p>
    <button onclick="clearCart()">Clear Cart</button>
  </section>

  <section class="billing-section">
    <h2>Payment</h2>
    <input type="number" id="amountInput" placeholder="Amount paid">
    <button id="calculateBtn">Calculate</button>
    <p id="result"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
